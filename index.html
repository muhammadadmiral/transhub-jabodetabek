    <title>TransHub Jabodetabek — Rute Transportasi Umum</title>
    <script>
      (() => {
        const raw = "%VITE_SITE_URL%";
        const configuredUrl = raw && raw !== "%VITE_SITE_URL%" ? raw : "";
        const siteUrl = configuredUrl.startsWith("http") ? configuredUrl : window.location.origin;
        const canonicalUrl = new URL("/", siteUrl).href;
        const canonical = document.createElement("link");
        canonical.rel = "canonical";
        canonical.href = canonicalUrl;
        document.head.append(canonical);
        for (const [property, content] of [["og:url", canonicalUrl], ["og:image", new URL("/social-card.png", siteUrl).href]]) {
          const meta = document.createElement("meta");
          meta.setAttribute("property", property);
          meta.content = content;
          document.head.append(meta);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
