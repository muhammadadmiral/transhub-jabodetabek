    <title>TransHub Jabodetabek — Rute Transportasi Umum</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TransHub Jabodetabek",
        "alternateName": "TransHub",
        "description": "Pencari rute multimoda untuk KRL, MRT, LRT, TransJakarta, dan angkot di Jabodetabek. Bandingkan waktu dan tarif secara instan.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "inLanguage": "id",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
        "featureList": ["Pencarian rute multimoda", "Perbandingan tarif", "Peta interaktif", "KRL, MRT, LRT, TransJakarta, Angkot"],
        "screenshot": "/social-card.png",
        "keywords": "transportasi umum, KRL, MRT, LRT, TransJakarta, Jabodetabek, peta transit"
      }
    </script>
    <script>
      (() => {
        const fallbackOrigin = window.location.origin;
        let configured = "";
        try {
          const meta = document.currentScript && document.currentScript.previousElementSibling;
          if (meta && meta instanceof HTMLMetaElement) {
            configured = meta.getAttribute("data-site-url") || "";
          }
        } catch {}
        const buildTime = typeof __VITE_SITE_URL__ !== "undefined" && __VITE_SITE_URL__ ? __VITE_SITE_URL__ : "";
        const siteUrl = [buildTime, configured].find((value) => value && value.startsWith("http")) || fallbackOrigin;
        const canonicalUrl = new URL("/", siteUrl).href;
        const canonical = document.createElement("link");
        canonical.rel = "canonical";
        canonical.href = canonicalUrl;
        document.head.appendChild(canonical);
        const socialImage = new URL("/social-card.png", siteUrl).href;
        const head = document.head;
        const existingOgImage = head.querySelector('meta[property="og:image"]');
        if (existingOgImage) existingOgImage.setAttribute("content", socialImage);
        const existingTwitterImage = head.querySelector('meta[name="twitter:image"]');
        if (existingTwitterImage) existingTwitterImage.setAttribute("content", socialImage);
        if (!head.querySelector('meta[property="og:url"]')) {
          const ogUrl = document.createElement("meta");
          ogUrl.setAttribute("property", "og:url");
          ogUrl.content = canonicalUrl;
          head.appendChild(ogUrl);
        }
        if (!head.querySelector('script[type="application/ld+json"][data-runtime="site-url"]')) {
          const ld = document.createElement("script");
          ld.type = "application/ld+json";
          ld.dataset.runtime = "site-url";
          ld.textContent = JSON.stringify({
            "@context": "https://schema.org",
            "@type": "WebApplication",
            url: canonicalUrl,
            image: socialImage,
            inLanguage: "id",
          });
          head.appendChild(ld);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
